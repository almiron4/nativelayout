name: CI (android)

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Build editor APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Test the core (CSS properties, states, media)
        run: gradle :core:test
      - run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nativelayout-debug
          path: android/app/build/outputs/apk/debug/*.apk

  example-testlayout:
    name: Build example (testlayout) against this commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Publish the library from this commit to Maven local
        run: gradle -p android :core:publishToMavenLocal :android:publishToMavenLocal

      - name: Point the example at the local library
        working-directory: android/examples/testlayout
        run: |
          set -euo pipefail
          LIB=$(sed -n 's/^version = "\(.*\)"/\1/p' ../../android/build.gradle.kts | head -n1)
          test -n "$LIB"
          sed -i "s#implementation(\"com.github.getnativelayout.nativelayout:nativelayout-android:[^\"]*\")#implementation(\"io.github.getnativelayout:nativelayout-android:$LIB\")#" app/build.gradle.kts
          sed -i "s#implementation(\"com.github.getnativelayout.nativelayout:nativelayout-core:[^\"]*\")#implementation(\"io.github.getnativelayout:nativelayout-core:$LIB\")#" app/build.gradle.kts
          sed -i 's#maven("https://jitpack.io")#maven("https://jitpack.io")\n        mavenLocal()#' settings.gradle.kts
          grep -n "nativelayout-" app/build.gradle.kts
          grep -n "mavenLocal" settings.gradle.kts

      - name: Build the example APK
        run: gradle -p android/examples/testlayout :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: testlayout-debug
          path: android/examples/testlayout/app/build/outputs/apk/debug/*.apk
