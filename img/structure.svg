<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">nativelayout repository layout</title>
  <desc id="d">The repository root branches into the Kotlin implementation in android/ (core, android, app, examples), the specification (SPEC.md and docs/spec/) and the project files.</desc>

  <style>
    .sans { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .name { font-size: 15px; font-weight: 700; fill: #1f2937; }
    .desc { font-size: 12.5px; fill: #586374; }
    .tag  { font-size: 11.5px; fill: #586374; }
    .hd   { font-size: 18px; font-weight: 700; fill: #ffffff; }
    .hs   { font-size: 12px; fill: #e8eef6; }
    .row  { fill: #ffffff; stroke: #d8dee4; stroke-width: 1.2; }
    .card { fill: #f6f8fa; stroke: #d8dee4; stroke-width: 1.2; }
    .link { fill: none; stroke: #9aa6b6; stroke-width: 2; stroke-linecap: round; }
  </style>

  <rect x="0.6" y="0.6" width="1198.8" height="538.8" rx="18" fill="#ffffff" stroke="#d8dee4" stroke-width="1.2"/>

  <!-- root -->
  <rect x="420" y="24" width="360" height="60" rx="14" fill="#2f3a4e"/>
  <text x="600" y="53" text-anchor="middle" class="sans" font-size="22" font-weight="700" fill="#ffffff">nativelayout/</text>
  <text x="600" y="72" text-anchor="middle" class="sans" font-size="12" fill="#b8c4d6">repository root</text>

  <!-- connectors -->
  <path class="link" d="M600 84 V107 M270 107 H1020 M270 107 V130 M690 107 V130 M1020 107 V130"/>

  <!-- ===== Column 1: android/ ===== -->
  <rect class="card" x="30" y="130" width="480" height="384" rx="14"/>
  <rect x="30" y="130" width="480" height="50" rx="14" fill="#0f9b68"/>
  <rect x="30" y="166" width="480" height="14" fill="#0f9b68"/>
  <text x="50" y="161" class="mono hd">android/</text>
  <text x="490" y="160" text-anchor="end" class="sans hs">Kotlin implementation</text>

  <rect class="row" x="50" y="194" width="440" height="52" rx="10"/>
  <text x="68" y="216" class="mono name">core/</text>
  <text x="68" y="235" class="sans desc">Expander and Engine (pure JVM)</text>

  <rect class="row" x="50" y="254" width="440" height="52" rx="10"/>
  <text x="68" y="276" class="mono name">android/</text>
  <text x="68" y="295" class="sans desc">Native host: creates and updates the views</text>

  <rect class="row" x="50" y="314" width="440" height="52" rx="10"/>
  <text x="68" y="336" class="mono name">app/</text>
  <text x="68" y="355" class="sans desc">Test editor with live preview</text>

  <rect class="row" x="50" y="374" width="440" height="52" rx="10"/>
  <text x="68" y="396" class="mono name">examples/</text>
  <text x="68" y="415" class="sans desc">Sample projects and screens</text>

  <text x="50" y="446" class="sans tag" letter-spacing="0.6">HOW A SCREEN BECOMES NATIVE VIEWS</text>
  <rect class="row" x="50" y="456" width="112" height="34" rx="9"/>
  <text x="106" y="477" text-anchor="middle" class="mono" font-size="12" fill="#1f2937">panel.nl + data</text>
  <path class="link" d="M165 473 H176"/><path d="M176 468.5 L183 473 L176 477.5 Z" fill="#9aa6b6"/>
  <rect class="row" x="186" y="456" width="86" height="34" rx="9"/>
  <text x="229" y="477" text-anchor="middle" class="sans" font-size="12.5" font-weight="600" fill="#1f2937">Expander</text>
  <path class="link" d="M275 473 H286"/><path d="M286 468.5 L293 473 L286 477.5 Z" fill="#9aa6b6"/>
  <rect class="row" x="296" y="456" width="76" height="34" rx="9"/>
  <text x="334" y="477" text-anchor="middle" class="sans" font-size="12.5" font-weight="600" fill="#1f2937">Engine</text>
  <path class="link" d="M375 473 H386"/><path d="M386 468.5 L393 473 L386 477.5 Z" fill="#9aa6b6"/>
  <rect x="396" y="456" width="94" height="34" rx="9" fill="#0f9b68"/>
  <text x="443" y="477" text-anchor="middle" class="sans" font-size="12.5" font-weight="600" fill="#ffffff">Native host</text>

