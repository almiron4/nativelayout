  <rect class="card" x="540" y="130" width="300" height="384" rx="14"/>
  <rect x="540" y="130" width="300" height="50" rx="14" fill="#3f4a5f"/>
  <rect x="540" y="166" width="300" height="14" fill="#3f4a5f"/>
  <text x="560" y="161" class="sans hd">Specification</text>
  <text x="820" y="160" text-anchor="end" class="sans hs">CC BY-SA 4.0</text>

  <rect class="row" x="560" y="194" width="260" height="64" rx="10"/>
  <text x="578" y="218" class="mono name">SPEC.md</text>
  <text x="578" y="237" class="sans desc">Index and overview,</text>
  <text x="578" y="252" class="sans desc">shared by every language</text>

  <rect class="row" x="560" y="266" width="260" height="64" rx="10"/>
  <text x="578" y="290" class="mono name">docs/spec/</text>
  <text x="578" y="309" class="sans desc">The specification split by</text>
  <text x="578" y="324" class="sans desc">subject (numbers unchanged)</text>

  <rect x="560" y="352" width="260" height="84" rx="10" fill="none" stroke="#9aa6b6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="690" y="381" text-anchor="middle" class="sans desc">Every implementation follows</text>
  <text x="690" y="399" text-anchor="middle" class="mono" font-size="12.5" font-weight="700" fill="#1f2937">SPEC.md</text>
  <text x="690" y="417" text-anchor="middle" class="sans desc">and .nl files work unchanged</text>

  <!-- ===== Column 3: project files ===== -->
  <rect class="card" x="870" y="130" width="300" height="384" rx="14"/>
  <rect x="870" y="130" width="300" height="50" rx="14" fill="#6a7a90"/>
  <rect x="870" y="166" width="300" height="14" fill="#6a7a90"/>
  <text x="890" y="161" class="sans hd">Project files</text>
  <text x="1150" y="160" text-anchor="end" class="sans hs">MPL 2.0</text>

  <rect class="row" x="890" y="194" width="260" height="44" rx="10"/>
  <text x="906" y="221" class="mono name" font-size="14">README.md</text>
  <text x="1136" y="220" text-anchor="end" class="sans tag">overview</text>

  <rect class="row" x="890" y="246" width="260" height="44" rx="10"/>
  <text x="906" y="273" class="mono name" font-size="14">CONTRIBUTING.md</text>
  <text x="1136" y="272" text-anchor="end" class="sans tag">guide</text>

  <rect class="row" x="890" y="298" width="260" height="44" rx="10"/>
  <text x="906" y="325" class="mono name" font-size="14">LICENSE</text>
  <text x="1136" y="324" text-anchor="end" class="sans tag">code, MPL 2.0</text>

  <rect class="row" x="890" y="350" width="260" height="44" rx="10"/>
  <text x="906" y="377" class="mono name" font-size="14">LICENSE-SPEC</text>
  <text x="1136" y="376" text-anchor="end" class="sans tag">spec, CC BY-SA</text>

  <rect class="row" x="890" y="402" width="260" height="44" rx="10"/>
  <text x="906" y="429" class="mono name" font-size="14">CITATION.cff</text>
  <text x="1136" y="428" text-anchor="end" class="sans tag">how to cite</text>

  <rect class="row" x="890" y="454" width="260" height="44" rx="10"/>
  <text x="906" y="481" class="mono name" font-size="14">img/</text>
  <text x="1136" y="480" text-anchor="end" class="sans tag">logo, screenshots</text>
